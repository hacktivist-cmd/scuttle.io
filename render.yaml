services:
  # ── FastAPI Web Service ──
  - type: web
    name: scuttle-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nigerian_university_polytechnic_jamb_engine:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scuttle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: scuttle-redis
          property: connectionString
      - key: FIREBASE_CREDENTIALS_B64
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: Scuttle.io
      - key: SITE_URL
        value: https://scuttle-io.netlify.app
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_RECIPIENT
        value: "2349021399488"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Celery Worker ──
  - type: worker
    name: scuttle-worker
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A nigerian_university_polytechnic_jamb_engine.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scuttle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: scuttle-redis
          property: connectionString
      - key: FIREBASE_CREDENTIALS_B64
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: Scuttle.io
      - key: SITE_URL
        value: https://scuttle-io.netlify.app
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Celery Beat ──
  - type: worker
    name: scuttle-beat
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A nigerian_university_polytechnic_jamb_engine.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scuttle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: scuttle-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Redis (correctly nested under services) ──
  - type: redis
    name: scuttle-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: scuttle-db
    plan: free
    databaseName: scuttle_db
    user: scuttle
